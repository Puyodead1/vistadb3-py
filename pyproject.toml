[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vistadb3"
version = "0.1.0"
description = "Pure-Python reader and writer for VistaDB 3.5 database files"
readme = "README.md"
requires-python = ">=3.9"
classifiers = ["Programming Language :: Python :: 3", "Topic :: Database"]

[project.scripts]
vistadb3 = "vistadb3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
